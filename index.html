<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TETORIS</title>
  <link rel="icon" type="image/png" href="artwork.png" />
  <link rel="stylesheet" href="style.css" />
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light';
  </script>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema"></button>
  <h1 class="game-title">TETORIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <div class="board-wrap">
        <canvas id="board" width="300" height="600"></canvas>
      </div>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>

    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="overlay-box pause-box">
        <p id="pause-title">PAUSA</p>
        <div class="menu" role="menu">
          <button class="menu-item" type="button" role="menuitem" tabindex="-1" data-action="resume">Reanudar</button>
          <button class="menu-item" type="button" role="menuitem" tabindex="-1" data-action="restart">Reiniciar</button>
          <button class="menu-item" type="button" role="menuitem" tabindex="-1" data-action="controls" aria-expanded="false">Ver controles</button>
          <ul id="menu-controls" class="menu-controls hidden">
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd><kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
          <div class="menu-item level-item" role="menuitem" tabindex="-1" data-action="level">
            <span>Nivel inicial</span>
            <span class="level-picker">
              <button type="button" class="level-btn" tabindex="-1" data-step="-1" aria-label="Bajar nivel inicial">◀</button>
              <span id="start-level-value">1</span>
              <button type="button" class="level-btn" tabindex="-1" data-step="1" aria-label="Subir nivel inicial">▶</button>
            </span>
          </div>
        </div>
        <p class="menu-hint">El nivel inicial se aplica al reiniciar</p>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
