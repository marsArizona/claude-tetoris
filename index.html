<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TETORIS</title>
  <link rel="icon" type="image/png" href="artwork.png" />
  <link rel="stylesheet" href="style.css" />
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light';
    try {
      // game.js valida el valor; uno desconocido no tiene estilos propios (equivale a retro)
      document.documentElement.dataset.skin = localStorage.getItem('skin') || 'retro';
    } catch (e) {
      document.documentElement.dataset.skin = 'retro';
    }
  </script>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema"></button>
  <h1 class="game-title">TETORIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <div class="board-wrap">
        <canvas id="board" width="300" height="600"></canvas>
      </div>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <label class="label" for="skin-select">SKIN</label>
          <select id="skin-select" class="skin-select" aria-label="Skin visual"></select>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>

    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <!-- Records al terminar la partida -->
        <div id="records-panel" class="records-panel is-hidden">
          <p id="new-record-msg" class="new-record-msg"></p>
          <div id="name-form" class="name-form is-hidden">
            <input id="name-input" type="text" maxlength="12" placeholder="Jugador" autocomplete="off" aria-label="Nombre del jugador" />
            <button id="save-name-btn" type="button">Guardar</button>
          </div>
          <table id="gameover-records" class="records-table"></table>
          <p id="gameover-stats" class="records-stats"></p>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- Menú de pausa -->
    <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="overlay-box pause-box">
        <p id="pause-title">PAUSA</p>
        <button id="pause-resume" class="menu-btn" type="button">Reanudar</button>
        <button id="pause-restart" class="menu-btn" type="button">Reiniciar</button>
        <button id="pause-controls-btn" class="menu-btn" type="button" aria-expanded="false" aria-controls="pause-controls">Ver controles</button>
        <ul id="pause-controls" class="pause-controls hidden">
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd><kbd>X</kbd> rotar</li>
          <li><kbd>↓</kbd> bajar</li>
          <li><kbd>Space</kbd> caída</li>
          <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
        </ul>
        <label class="pause-level" for="start-level">Nivel inicial
          <select id="start-level"></select>
        </label>
        <p class="pause-hint">Se aplica en la próxima partida</p>
      </div>
    </div>

    <!-- Pantalla de inicio con la tabla de records -->
    <div id="start-screen" class="overlay start-screen">
      <div class="overlay-box">
        <p class="start-title">TETORIS</p>
        <span class="label">RECORDS</span>
        <table id="start-records" class="records-table"></table>
        <p id="start-stats" class="records-stats"></p>
        <button id="play-btn" class="primary-btn" type="button">JUGAR</button>
        <p class="start-hint">o pulsa <kbd>Enter</kbd></p>
        <button id="reset-records-btn" class="link-btn" type="button">Borrar records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
