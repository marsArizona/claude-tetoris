<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TETORIS</title>
  <link rel="icon" type="image/png" href="artwork.png" />
  <link rel="stylesheet" href="style.css" />
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light';
  </script>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema"></button>
  <h1 class="game-title">TETORIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <div class="board-wrap">
        <canvas id="board" width="300" height="600"></canvas>
      </div>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>

    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-box">
        <p id="overlay-title">TETORIS</p>
        <p id="overlay-score"></p>
        <p id="new-record" class="new-record hidden"></p>
        <form id="name-form" class="name-form hidden" autocomplete="off">
          <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" aria-label="Nombre del jugador" />
          <button type="submit">Guardar</button>
        </form>
        <section id="records" class="records">
          <span class="label">RÉCORDS</span>
          <table class="records-table">
            <thead>
              <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th></tr>
            </thead>
            <tbody id="records-body"></tbody>
          </table>
          <p class="records-stats">
            Mejor combo: <span id="best-combo">0</span> ·
            Líneas máx.: <span id="max-lines">0</span>
          </p>
          <button id="reset-records-btn" class="reset-records-btn" type="button">Borrar récords</button>
        </section>
        <button id="restart-btn">Jugar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
